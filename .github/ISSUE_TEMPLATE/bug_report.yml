name: Bug report / 错误反馈
description: Report a reproducible problem / 反馈可以复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PDF Merge Navigator.

        感谢你帮助改进 PDF Merge Navigator。请勿上传包含个人信息、客户资料或其他敏感内容的 PDF；必要时请制作不含敏感信息的测试文件。

  - type: input
    id: version
    attributes:
      label: App version / 软件版本
      description: For example, v0.1.0 / 例如 v0.1.0
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows version / Windows 版本
      options:
        - Windows 11
        - Windows 10
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened? / 出现了什么问题？
      description: Describe the actual result and any error message. / 请描述实际结果和错误提示。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: List the shortest sequence that consistently causes the problem. / 请列出能够稳定触发问题的最短操作步骤。
      placeholder: |
        1. Add ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
      description: What did you expect to happen? / 你原本希望得到什么结果？
    validations:
      required: true

  - type: textarea
    id: pdf-details
    attributes:
      label: PDF details / PDF 情况
      description: Optional. Include page counts and whether files are encrypted, scanned, signed, or unusually large. Do not upload sensitive files. / 选填。请说明页数以及文件是否加密、扫描、签名或体积较大，不要上传敏感文件。

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I have removed personal, customer, and other sensitive information. / 我已移除个人、客户及其他敏感信息。
          required: true
